version: '3.8'

services:
  web:
    build: .
    ports:
    - "5002:5002"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
  
  redis:
    image: "redis:latest"
    ports:
    - "6379:6379"
    volumes:
    - redis-data:/data

# volume: this will ensure that redis data persists even if the container is stopped.
# meaning the page will continue from wherever it was before the container was stopped.

volumes:
  redis-data:
